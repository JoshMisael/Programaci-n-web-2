server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # El nginx del frontend NO debe recibir llamadas /api/
    # Si llegan directamente (sin pasar por el proxy), las rechaza limpiamente
    location /api/ {
        return 404 '{"error":"acceso directo al frontend no permitido"}';
        add_header Content-Type application/json;
    }

    # SPA: todas las rutas sirven index.html para que React Router funcione
    location / {
        try_files $uri $uri/ /index.html;
    }
}
