version: '3.9'

networks:
  bicitaxi-net:
    driver: bridge

volumes:
  postgres_data:

services:
  db:
    build: ./database
    container_name: bicitaxi-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bicitaxi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: bicitaxi-backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - bicitaxi-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: bicitaxi-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - bicitaxi-net
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: bicitaxi-nginx
    ports:
      - "8000:80"
    depends_on:
      - frontend
      - backend
    networks:
      - bicitaxi-net
    restart: unless-stopped
